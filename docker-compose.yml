# All app services run with host networking: the RPC node is typically an
# SSH tunnel bound to the host's loopback, and default-deny host firewalls
# (ufw) drop docker bridge->host traffic, so bridge-networked containers
# could never reach it. In the host netns, localhost:8545 just works, web
# frontends proxy their APIs over loopback, and ufw still shields every
# listening port from the LAN. Postgres stays bridged; its port is published
# on 127.0.0.1, which host-networked services reach as localhost:5432.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-mev_inspect}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mev_inspect_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Not a long-running service: builds the image explorer-api invokes per
  # block (docker run mev-inspect-py:local cli.py inspect-block-command <n>).
  # The build context lives in the gitignored local mev-monitor/ checkout —
  # the image is the platform's only dependency on it (ADR-003).
  # `docker compose --profile tools run --rm mev-inspect -m alembic upgrade head`
  # applies its migrations.
  mev-inspect:
    build: ./mev-monitor/mev-inspect-py
    image: ${MEV_INSPECT_IMAGE:-mev-inspect-py:local}
    profiles: ["tools"]
    network_mode: host
    working_dir: /app
    entrypoint: ["python"]
    environment:
      POSTGRES_HOST: localhost
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-mev_inspect}
      RPC_URL: ${RPC_URL}

  explorer-api:
    build:
      context: .
      dockerfile: apps/explorer-api/Dockerfile
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    volumes:
      # explorer-api spawns mev-inspect-py containers on the host docker
      # daemon (ADR-002) — the one privileged edge in this deployment.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy

  explorer-web:
    build:
      context: .
      dockerfile: apps/explorer-web/Dockerfile
    network_mode: host
    environment:
      EXPLORER_WEB_PORT: ${EXPLORER_WEB_PORT:-8080}
      EXPLORER_API_PORT: ${EXPLORER_API_PORT:-3000}
    depends_on:
      - explorer-api

  trace-api:
    build:
      context: .
      dockerfile: apps/trace-api/Dockerfile
    network_mode: host
    env_file:
      - path: .env
        required: false

  trace-web:
    build:
      context: .
      dockerfile: apps/trace-web/Dockerfile
    network_mode: host
    environment:
      TRACE_WEB_PORT: ${TRACE_WEB_PORT:-8081}
      TRACE_API_PORT: ${TRACE_API_PORT:-2021}
    depends_on:
      - trace-api

volumes:
  mev_inspect_pgdata:
    # Set POSTGRES_VOLUME to reuse an existing data volume (e.g. the one the
    # reference mev-monitor stack created: mev-monitor_mev_inspect_pgdata).
    name: ${POSTGRES_VOLUME:-mev_inspect_pgdata}
