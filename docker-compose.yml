# All app services run with host networking: the RPC node is typically an
# SSH tunnel bound to the host's loopback, and default-deny host firewalls
# (ufw) drop docker bridge->host traffic, so bridge-networked containers
# could never reach it. In the host netns, localhost:8545 just works, web
# frontends proxy their APIs over loopback, and ufw still shields every
# listening port from the LAN. Postgres stays bridged; its port is published
# on 127.0.0.1, which host-networked services reach as localhost:5432.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-mev_inspect}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mev_inspect_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Web UI for the shared Postgres. Host-networked like the app services, so
  # it reaches postgres on 127.0.0.1:5432 and ufw shields its port from the
  # LAN. Log in with PGADMIN_EMAIL/PGADMIN_PASSWORD from .env; the platform
  # database is preregistered via servers.json (pgadmin asks for the postgres
  # password once, then keeps it in its own volume).
  pgadmin:
    image: dpage/pgadmin4:9
    network_mode: host
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@mev.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: ${PGADMIN_PORT:-5050}
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./scripts/pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Block inspection is native and in-process now (ADR-010): explorer-api owns
  # the pipeline schema (migrate() at boot, replacing `alembic upgrade head`)
  # and decodes blocks via @mev/inspect. There is no mev-inspect-py image and no
  # `tools` profile — the mev-monitor/ checkout has no runtime role.
  explorer-api:
    build:
      context: .
      dockerfile: apps/explorer-api/Dockerfile
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      # Set true to continuously inspect new blocks as the chain advances.
      INSPECTOR_FOLLOW_HEAD: ${INSPECTOR_FOLLOW_HEAD:-false}
    depends_on:
      postgres:
        condition: service_healthy

  explorer-web:
    build:
      context: .
      dockerfile: apps/explorer-web/Dockerfile
    network_mode: host
    environment:
      EXPLORER_WEB_PORT: ${EXPLORER_WEB_PORT:-8080}
      EXPLORER_API_PORT: ${EXPLORER_API_PORT:-3000}
      DISCO_WEB_PORT: ${DISCO_WEB_PORT:-8082}
    depends_on:
      - explorer-api

  # Agentic analysis for the disco Analyze panel (ADR-006/009). Embeds the pi
  # SDK; one in-memory session per request. Base config (credentials + model
  # selection) is NOT baked in - it is read from the pi agent dir bind-mounted
  # from the host and pointed at via PI_CODING_AGENT_DIR, so which model runs is
  # the user's pi configuration. Runs as the host uid so it can read the agent
  # dir's auth.json (mode 600); the mount is writable because pi takes a
  # proper-lockfile lock even to read auth.json (sessions stay in-memory, so no
  # session files are written). The project .pi/ (baked into the image)
  # supplements it: .pi/SYSTEM.md overrides the system prompt.
  agent-api:
    build:
      context: .
      dockerfile: apps/agent-api/Dockerfile
    network_mode: host
    user: "${DISCO_UID:-1000}:${DISCO_GID:-1000}"
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      PI_CODING_AGENT_DIR: /pi-agent
      HOME: /tmp
    volumes:
      - ${PI_AGENT_DIR:-${HOME}/.pi/agent}:/pi-agent
    depends_on:
      postgres:
        condition: service_healthy

  trace-api:
    build:
      context: .
      dockerfile: apps/trace-api/Dockerfile
    network_mode: host
    # same uid as disco-api: synthetic trace-<hash8> project configs (ADR-008)
    # are written into the bind-mounted submodule projects dir and must land
    # on the host owned by the user, untracked like UI-created projects
    user: "${DISCO_UID:-1000}:${DISCO_GID:-1000}"
    env_file:
      - path: .env
        required: false
    environment:
      DISCOVERY_PROJECTS_DIR: /projects
    volumes:
      - ./l2beat/packages/config/src/projects:/projects
    depends_on:
      - disco-api

  # DiscoUI backend: l2b ui from the pinned l2beat submodule via its own
  # Dockerfile (heavy first build - the whole l2beat monorepo). The image's
  # CMD bakes in --readonly; we override the command to run writable so the
  # UI at disco-web can create projects, run `l2b discover` from the terminal
  # panel, and read contract sources from disk (.flat). The image's own
  # protocolbeat build is masked with an empty tmpfs, so port 2021 serves the
  # API only - no duplicate readonly UI is hosted. Discovery projects + cache
  # are bind-mounted from the submodule checkout (running as the host uid) so
  # created projects persist on the host; they stay untracked there.
  disco-api:
    build:
      context: ./l2beat
      dockerfile: packages/l2b/Dockerfile.disco-ui
    network_mode: host
    user: "${DISCO_UID:-1000}:${DISCO_GID:-1000}"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${DISCO_API_PORT:-2021}
      HOME: /tmp
      # the l2b shim created in command below must be on PATH for the
      # terminal endpoints, which spawn `l2b discover ...` via a shell
      PATH: /tmp/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # discovery reads *_FOR_DISCOVERY vars, falling back to plain
      # ETHERSCAN_API_KEY (supplied by env_file from the root .env)
      ETHEREUM_RPC_URL_FOR_DISCOVERY: ${RPC_URL}
      # bound the sockets discovery may hold open: the shared RPC node caps
      # concurrent connections and unbounded `l2b discover` runs starve every
      # other service. Inherited by spawned l2b children.
      NODE_OPTIONS: --require /app/limit-rpc-sockets.cjs --require /app/bound-getlogs.cjs
      RPC_MAX_SOCKETS: ${RPC_MAX_SOCKETS:-1000}
      # the node has no log index (a single 100k-block eth_getLogs chunk
      # takes ~11s idle), so proxy upgrade-history scans are bounded to the
      # recent past or trace-workspace discovery runs never finish (ADR-008)
      RPC_GETLOGS_MAX_BLOCKS: ${RPC_GETLOGS_MAX_BLOCKS:-1000000}
    volumes:
      - ./l2beat/packages/config/src/projects:/app/packages/config/src/projects
      - ./l2beat/packages/config/cache:/app/packages/config/cache
      - ./scripts/limit-rpc-sockets.cjs:/app/limit-rpc-sockets.cjs:ro
      - ./scripts/bound-getlogs.cjs:/app/bound-getlogs.cjs:ro
    tmpfs:
      - /app/packages/protocolbeat/build
    command:
      - sh
      - -c
      - |
        mkdir -p /tmp/bin
        printf '#!/bin/sh\nexec node /app/packages/l2b/dist/cli.js "$$@"\n' > /tmp/bin/l2b
        chmod +x /tmp/bin/l2b
        exec node packages/l2b/dist/cli.js ui

  # DiscoUI frontend: our protocolbeat clone with the trace panel (ADR-004/005)
  disco-web:
    build:
      context: .
      dockerfile: apps/disco/Dockerfile
    network_mode: host
    environment:
      DISCO_WEB_PORT: ${DISCO_WEB_PORT:-8082}
      DISCO_API_PORT: ${DISCO_API_PORT:-2021}
      TRACE_API_PORT: ${TRACE_API_PORT:-2022}
      EXPLORER_API_PORT: ${EXPLORER_API_PORT:-3000}
      AGENT_API_PORT: ${AGENT_API_PORT:-3100}
    depends_on:
      - disco-api
      - trace-api
      - explorer-api
      - agent-api

volumes:
  mev_inspect_pgdata:
    # Set POSTGRES_VOLUME to reuse an existing data volume (e.g. the one the
    # reference mev-monitor stack created: mev-monitor_mev_inspect_pgdata).
    # external: the volume is managed outside this project, so `docker compose
    # down -v` can never delete inspected-block data. Create it once on a
    # fresh host: docker volume create mev_inspect_pgdata
    name: ${POSTGRES_VOLUME:-mev_inspect_pgdata}
    external: true
  # pgadmin's own state (saved connections, preferences) — droppable
  pgadmin_data:
